<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blacklist Management</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>
    /* ... [KEEP ORIGINAL CSS STYLES] ... */
    /* (Copy CSS from previous response or existing file) */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f9; display: flex; }
    .sidebar { width: 220px; background: #1a237e; color: white; height: 100vh; position: fixed; padding-top: 60px; }
    .sidebar ul { list-style: none; padding: 0; }
    .sidebar li { padding: 15px; display: flex; gap: 10px; cursor: pointer; }
    .sidebar li.active { background: #0f1651; }
    .sidebar a { color: white; text-decoration: none; display: flex; width: 100%; gap: 10px; }
    .main-container { margin-left: 220px; width: calc(100% - 220px); }
    .glass-card { background: white; padding: 30px; margin: 30px; border-radius: 10px; }
    /* Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 400px; }
    .btn { background: #1a237e; color: white; padding: 8px 15px; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="modal-overlay" id="addBlacklistModal">
      <div class="modal-content">
          <h3>Add to Blacklist</h3>
          <form id="addBlacklistForm">
              <select id="modalBlacklistType"><option value="dl">DL</option><option value="rc">RC</option></select>
              <div id="dlGroup">
                  <input type="radio" name="dlMode" id="dlSingle" checked onclick="toggleDl()"> Single
                  <input type="radio" name="dlMode" id="dlBulk" onclick="toggleDl()"> Bulk
                  <div id="dlSingleInput"><input id="dlNum" placeholder="DL Number"><input id="dlName" placeholder="Name"></div>
                  <div id="dlBulkInput" style="display:none"><input type="file" id="dlCsv"></div>
              </div>
              <div id="rcGroup" style="display:none">
                  <input type="radio" name="rcMode" id="rcSingle" checked onclick="toggleRc()"> Single
                  <input type="radio" name="rcMode" id="rcBulk" onclick="toggleRc()"> Bulk
                  <div id="rcSingleInput"><input id="rcNum" placeholder="RC Number"><input id="rcOwner" placeholder="Owner"></div>
                  <div id="rcBulkInput" style="display:none"><input type="file" id="rcCsv"></div>
              </div>
              <br><button type="submit" class="btn">Submit</button> <button type="button" onclick="closeModal()">Cancel</button>
          </form>
      </div>
  </div>

  <div class="sidebar">
      <ul>
          <li><a href="scan.html"><i class="material-icons">home</i>Home</a></li>
          <li class="active"><i class="material-icons">block</i>Blacklist</li>
      </ul>
  </div>

  <div class="main-container">
      <main>
          <div class="glass-card">
              <h2>Blacklist Management</h2>
              <button class="btn" onclick="openModal()">Add Entry</button>
              <div id="results"></div>
          </div>
      </main>
  </div>

  <script>
    function openModal() { document.getElementById('addBlacklistModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addBlacklistModal').style.display = 'none'; }
    
    function toggleDl() { 
        document.getElementById('dlSingleInput').style.display = document.getElementById('dlSingle').checked ? 'block' : 'none';
        document.getElementById('dlBulkInput').style.display = document.getElementById('dlBulk').checked ? 'block' : 'none';
    }
    function toggleRc() { 
        document.getElementById('rcSingleInput').style.display = document.getElementById('rcSingle').checked ? 'block' : 'none';
        document.getElementById('rcBulkInput').style.display = document.getElementById('rcBulk').checked ? 'block' : 'none';
    }

    document.getElementById('modalBlacklistType').addEventListener('change', function() {
        document.getElementById('dlGroup').style.display = this.value === 'dl' ? 'block' : 'none';
        document.getElementById('rcGroup').style.display = this.value === 'rc' ? 'block' : 'none';
    });

    document.getElementById('addBlacklistForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const type = document.getElementById('modalBlacklistType').value;
        const token = localStorage.getItem("token"); // 🔐 GET TOKEN

        if (type === 'dl' && document.getElementById('dlBulk').checked) {
            const file = document.getElementById('dlCsv').files[0];
            const formData = new FormData();
            formData.append('file', file);
            
            // 🔐 SECURE BULK UPLOAD
            await fetch('http://localhost:3000/api/admin/bulk-dl', {
                method: 'POST',
                headers: { "Authorization": `Bearer ${token}` },
                body: formData
            });
            alert("Bulk DL Uploaded");
        } 
        else if (type === 'rc' && document.getElementById('rcBulk').checked) {
            const file = document.getElementById('rcCsv').files[0];
            const formData = new FormData();
            formData.append('file', file);
            
            // 🔐 SECURE BULK UPLOAD
            await fetch('http://localhost:3000/api/admin/bulk-rc', {
                method: 'POST',
                headers: { "Authorization": `Bearer ${token}` },
                body: formData
            });
            alert("Bulk RC Uploaded");
        }
        // ... (Single entry logic remains the same) ...
        closeModal();
    });
  </script>
</body>
</html>
